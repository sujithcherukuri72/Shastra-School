# Local development: only the database runs in Docker.
#   docker compose up -d db
# The API and web app run on your machine with `npm run dev`.
name: shastra-dev

services:
  db:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      DB_NAME: ${DB_NAME:-shastra}
      DB_APP_USER: ${DB_APP_USER:-shastra_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      TZ: Asia/Kolkata
    # Bound to localhost only — never reachable from the network.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-init-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-shastra}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
