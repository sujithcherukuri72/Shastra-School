name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_USER: shastra_app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: shastra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shastra_app" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://shastra_app:ci-password@localhost:5432/shastra
      SESSION_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      MFA_ENCRYPTION_KEY: ci-only-mfa-key-0123456789abcdefghijklmnopqrstuvwxyz
      RUN_JOBS_IN_API: 'false'
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run seed
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - run: docker build -f apps/api/Dockerfile -t shastra-api:ci .
      - run: docker build -f apps/web/Dockerfile -t shastra-web:ci .
